name: Publish release assets to PyPI

on:
  workflow_dispatch:
    inputs:
      release_tag:
        description: GitHub release tag containing the reviewed package artifacts
        required: true
        type: string

concurrency:
  group: pypi-publish
  cancel-in-progress: false

permissions:
  contents: read

jobs:
  publish:
    name: Publish to PyPI
    runs-on: ubuntu-latest
    environment:
      name: pypi
      url: https://pypi.org/project/pinax-tracker/
    permissions:
      contents: read
      id-token: write

    steps:
      - name: Check the tag against the package version
        env:
          GH_TOKEN: ${{ github.token }}
          RELEASE_TAG: ${{ inputs.release_tag }}
          REPOSITORY: ${{ github.repository }}
        shell: bash
        run: |
          set -euo pipefail
          if ! [[ "$RELEASE_TAG" =~ ^v[0-9]+\.[0-9]+\.[0-9]+$ ]]; then
            echo "release_tag must use the form vX.Y.Z" >&2
            exit 1
          fi

          expected="${RELEASE_TAG#v}"
          raw="Accept: application/vnd.github.raw"
          pyproject_text="$(gh api -H "$raw" "repos/$REPOSITORY/contents/pyproject.toml?ref=$RELEASE_TAG")"
          module_text="$(gh api -H "$raw" "repos/$REPOSITORY/contents/pinax/__init__.py?ref=$RELEASE_TAG")"
          pyproject_version="$(printf '%s\n' "$pyproject_text" | sed -nE 's/^version = "([^"]+)"$/\1/p' | head -n 1)"
          module_version="$(printf '%s\n' "$module_text" | sed -nE 's/^__version__ = "([^"]+)"$/\1/p' | head -n 1)"

          if [ "$pyproject_version" != "$expected" ]; then
            echo "release_tag $RELEASE_TAG does not match the pyproject.toml version '$pyproject_version'" >&2
            exit 1
          fi
          if [ "$module_version" != "$expected" ]; then
            echo "release_tag $RELEASE_TAG does not match the pinax/__init__.py version '$module_version'" >&2
            exit 1
          fi

      - name: Download the GitHub release assets
        env:
          GH_TOKEN: ${{ github.token }}
          RELEASE_TAG: ${{ inputs.release_tag }}
          REPOSITORY: ${{ github.repository }}
        shell: bash
        run: |
          set -euo pipefail
          if ! [[ "$RELEASE_TAG" =~ ^v[0-9]+\.[0-9]+\.[0-9]+$ ]]; then
            echo "release_tag must use the form vX.Y.Z" >&2
            exit 1
          fi

          mkdir -p release-assets dist
          gh release download "$RELEASE_TAG" \
            --repo "$REPOSITORY" \
            --dir release-assets \
            --pattern "pinax_tracker-*.whl" \
            --pattern "pinax_tracker-*.tar.gz" \
            --pattern "SHA256SUMS"

      - name: Verify the release assets
        env:
          RELEASE_TAG: ${{ inputs.release_tag }}
        shell: bash
        run: |
          set -euo pipefail
          shopt -s nullglob
          cd release-assets

          test -f SHA256SUMS
          version="${RELEASE_TAG#v}"
          wheels=(pinax_tracker-*.whl)
          sdists=(pinax_tracker-*.tar.gz)
          test "${#wheels[@]}" -eq 1
          test "${#sdists[@]}" -eq 1
          if [ "${wheels[0]}" != "pinax_tracker-${version}-py3-none-any.whl" ] \
            || [ "${sdists[0]}" != "pinax_tracker-${version}.tar.gz" ]; then
            echo "release assets are not version $version: ${wheels[0]} ${sdists[0]}" >&2
            exit 1
          fi
          packages=("${wheels[0]}" "${sdists[0]}")

          mapfile -t listed < <(sed -E 's/^[0-9A-Fa-f]{64} [ *]//' SHA256SUMS | LC_ALL=C sort)
          mapfile -t expected < <(printf '%s\n' "${packages[@]}" | LC_ALL=C sort)
          test "${#listed[@]}" -eq 2
          test "${listed[0]}" = "${expected[0]}"
          test "${listed[1]}" = "${expected[1]}"
          sha256sum --check --strict SHA256SUMS

          cp -- "${packages[@]}" ../dist/

      - name: Publish the verified distributions
        uses: pypa/gh-action-pypi-publish@dc37677b2e1c63e2034f94d8a5b11f265b73ba33 # release/v1
        with:
          packages-dir: dist
          verify-metadata: true
          skip-existing: false
          attestations: true
          print-hash: true
